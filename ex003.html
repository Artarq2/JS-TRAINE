<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu primeiro programa</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #867777;
        color: #1a1919;
        padding: 20px;
      }
      h1 {
        color: #080808;
      }
    </style>
  </head>
  <body>
    <h1>Hello World!</h1>
    <p>A maldição do mundo já foi quebrada</p>
    <script>
      let n1 = window.prompt("Digite um número:"); // String
      let n2 = window.prompt("Digite outro número:"); // STRING
      let resultado = Number(n1) + Number(n2); // Converste as Strings para Números usados na soma.
      window.alert(
        `O resultado da soma de ${n1} e ${n2} é igual a ${resultado}`,
      ); // Mostra o resultado da soma para o usuário.
    </script>
  </body>
</html>
