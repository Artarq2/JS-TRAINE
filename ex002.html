<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu primeiro programa</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #867777;
        color: #1a1919;
        padding: 20px;
      }
      h1 {
        color: #080808;
      }
    </style>
  </head>
  <body>
    <h1>Hello World!</h1>
    <p>A maldição do mundo já foi quebrada</p>
    <script>
      let nome = window.prompt("Qual é o seu favorito sabor de picolé?"); //Esse comando é para o usuário digitar algo, e o que ele digitar vai ser armazenado em uma variável.
      window.alert("É um grande prazer lhe conhecer," + nome + "!"); //concatenação "+" é para juntar o texto com a variável.
    </script>
  </body>
</html>
