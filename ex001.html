<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meu primeiro programa</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #867777;
        color: #1a1919;
        padding: 20px;
      }
      h1 {
        color: #080808;
      }
    </style>
  </head>
  <body>
    <h1>Hello World!</h1>
    <p>A maldição do mundo já foi quebrada</p>
    <script>
      window.alert("Olá, mundo! Este é o meu primeiro programa em JavaScript."); //Esse comando é para mostrar uma mensagem para o usuário, e ele só pode clicar em "OK" para fechar a caixa de diálogo.
      window.confirm("Você gosta de picolé de coco queimado?"); //Esse comando é para o usuário clicar em "OK" ou "Cancelar", e o resultado (true ou false) vai ser armazenado em uma variável.
      window.prompt("Qual é o seu favorito sabor de picolé?"); //Esse comando é para o usuário digitar algo, e o que ele digitar vai ser armazenado em uma variável.
    </script>
  </body>
</html>
