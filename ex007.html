<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Somando Gatinhos</title>
  </head>
  <body>
    <h1>Somando Gatinhos</h1>
    <input
      type="number"
      name="txtn1"
      id="txtn1"
      placeholder="Digite um número"
    />
    <input
      type="number"
      name="txtn2"
      id="txtn2"
      placeholder="Digite outro número"
    />
    <input type="button" value="Somar" onclick="somar()" />
    <script>
      function somar() {
        let n1 = window.document.getElementById("txtn1").value; // Seleciona o valor do elemento <input> com id "txtn1".
        let n2 = window.document.querySelector("input#txtn2").value; // Seleciona o valor do elemento <input> com id "txtn2".
        let res = Number(n1) + Number(n2); // Converte os valores para números e realiza a soma.
        window.alert(`O resultado da soma é ${res}`); // Exibe o resultado da soma em um alerta.
      }
    </script>
  </body>
</html>
